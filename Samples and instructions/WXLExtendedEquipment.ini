; WXLExtendedEquipment.ini
; Lives beside WarcraftXL.dll itself -- i.e. the game's own root folder, since that's where
; WarcraftXL.dll is loaded from (this module is built into WarcraftXL.dll, there is no separate
; WXLExtendedEquipment.dll). Any value that isn't a nonzero integer (including a missing
; key/section/file) is treated as the default shown below.

[EagerPreload]
; Bake every sidecar-known weapon displayId at startup, ahead of the char-select preview.
; Safe to turn off: OnItemSlotChange/OnWeaponVisualChange/OnItemDisplayLookup already patch a
; weapon reactively the moment it's actually equipped, eager preload only gets you there sooner.
Weapons=0

; Bake every sidecar-known creature displayId at startup, ahead of the first spawn/preview model.
; Safe to turn off: unlike weapons, creature models have a genuine lazy fallback too (baked on
; first VirtualProvide miss instead of at startup), so nothing goes unpatched either way -- turning
; this off just trades "pay the cost for every sidecar entry at startup" for "pay it once per
; displayId, the first time it's actually requested".
Creatures=0

[Memory]
; Soft cap, in megabytes, on the combined size of all baked creature model overrides kept resident
; at once (raw .m2 + .skin bytes, NOT the client's own in-engine parsed copy of them -- the actual
; memory cost per creature is higher than this number alone suggests). Once exceeded, the
; least-recently-served creature entries are evicted to make room for new ones; an evicted entry is
; simply rebaked (see CreatureLazyResolve) the next time something actually asks for it again --
; not lost, just paid for again on demand. Currently-visible creatures are unaffected by an
; eviction: by the time the client is rendering one, it already has its own copy of the geometry,
; independent of this table.
;
; <= 0 (or this key/section/file missing entirely) means uncapped -- entries are still tracked, just
; never actually evicted. Only applies to creature entries; weapon overrides are never evictable.
MaxCreatureCacheMB=128
MaxWeaponCacheMB=64
